# Local Supabase CLI project for Flow.
# Hosted project (do not put keys in this file):
#   ref    sxqpnetmtufkzowutduq
#   url    https://sxqpnetmtufkzowutduq.supabase.co
#   region eu-central-1
#   postgres 17
# Google OAuth stays off here until the client id and secret exist.
# Set them in the hosted dashboard, or via env() when running locally.

project_id = "flow"

[api]
enabled = true
# flow-postgrest-version: 16.3
# CLI 2.118.0 pulls ghcr.io/supabase/cli/postgrest:v16.2. That image is built
# FROM postgrest/postgrest:v16.3, which is the API version. Native gen types
# does not embed it. scripts/check-db-types.sh reads the line above and passes
# it as --postgrest-version once the CLI accepts the flag.
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./tests/helpers.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:43123"
additional_redirect_urls = ["http://127.0.0.1:43123/**"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = false

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

[edge_runtime]
enabled = true

# Local only. The value lives in the shell or supabase/.env, never in git.
[edge_runtime.secrets]
SUMIT_KEK = "env(SUMIT_KEK)"
CRON_SECRET = "env(CRON_SECRET)"
FLOW_MCP_PEPPER = "env(FLOW_MCP_PEPPER)"
FLOW_MCP_APP_ORIGINS = "http://127.0.0.1:43123,http://localhost:43123,https://flow-app-dx5.pages.dev"

# The cron drain sends x-flow-cron and has no user JWT. The function checks that secret itself.
[functions.sumit-sync]
verify_jwt = false

# CD calls sumit-reseal with the same cron header, before db push. Decision 0085.
[functions.sumit-reseal]
verify_jwt = false

# Jev tagging uses the same cron header. It is not scheduled. Decision 0084.
[functions.jev-tag]
verify_jwt = false

# The bearer is the MCP secret or the app JWT, checked inside the function.
[functions.flow-mcp]
verify_jwt = false
