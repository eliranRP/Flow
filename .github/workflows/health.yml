name: health

# FLOW-802: a daily read-only health check of production (decision 0151). A failed run means an
# alert; GitHub emails the user who last changed the schedule line, when their Actions
# notifications are on. What each alert means: docs/runbooks/health-check.md.
# The database URL lives on the production environment, which only main can use.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install psql
        timeout-minutes: 5
        run: bash scripts/ci-apt-cache.sh psql
      - name: Health check
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/health-check.sh
