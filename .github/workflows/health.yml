name: health

# FLOW-802: a daily read-only health check of production (decision 0151). A failed run means an
# alert, and GitHub emails the repo owner. What each alert means: docs/runbooks/health-check.md.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install psql
        timeout-minutes: 5
        run: bash scripts/ci-apt-cache.sh psql
      - name: Health check
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/health-check.sh
