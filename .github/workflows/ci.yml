name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Migration filenames are append-only
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          if git cat-file -e origin/main:supabase/migrations.lock 2>/dev/null; then
            base="$(mktemp)"
            git show origin/main:supabase/migrations.lock > "$base"
            node scripts/check-migration-order.mjs --base "$base"
            rm -f "$base"
          else
            node scripts/check-migration-order.mjs
          fi
      - run: pnpm install --frozen-lockfile
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
      - name: Deno tests for flow-mcp
        run: deno test --allow-env supabase/functions/flow-mcp
      - run: pnpm typecheck
      # Root bundle tests, then @flow/app and @flow/shared unit tests.
      - run: pnpm test
      - name: Build the hosted dist
        run: pnpm build
      - name: Stamp the commit and check the hosted bundle
        run: |
          node scripts/stamp-build.mjs "$GITHUB_SHA"
          pnpm check:bundle
          rm -rf hosted-dist
          mkdir -p hosted-dist
          cp -a app/dist/. hosted-dist/
      - name: Build the reviewers-only dist and check it
        env:
          VITE_REVIEWER_BUILD: "1"
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_ANON_KEY: ""
        run: |
          rm -rf app/dist
          pnpm build
          pnpm check:reviewer-bundle
          test ! -f app/dist/build.txt
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: pnpm --filter @flow/app exec playwright install-deps chromium
      - name: Install Playwright browsers
        timeout-minutes: 5
        run: pnpm --filter @flow/app exec playwright install chromium
      - run: pnpm test:storybook
      - run: pnpm build-storybook
      - run: pnpm test:storybook:smoke
      - name: Upload hosted dist
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-dist
          path: hosted-dist
          if-no-files-found: error
      - name: Upload reviewer dist
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewer-dist
          path: app/dist
          if-no-files-found: error
      - name: Upload storybook-static
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-static
          path: app/storybook-static
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0
      - name: Start local Supabase
        run: supabase start
      - name: flow-mcp answers on the local API
        run: bash scripts/mcp-function-smoke.sh
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: pnpm --filter @flow/app exec playwright install-deps chromium
      - name: Install Playwright browsers
        timeout-minutes: 5
        run: pnpm --filter @flow/app exec playwright install chromium
      - name: pgTAP
        run: supabase test db supabase/tests/database
      - run: bash scripts/check-db-types.sh
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Deploy preflight against local Supabase
        run: |
          set -euo pipefail
          db_url="$(supabase status -o env | sed -n 's/^DB_URL=//p' | head -n 1 | tr -d '"')"
          log="$(mktemp)"
          FLOW_CD_PREFLIGHT_LOCAL=1 SUPABASE_DB_URL="$db_url" bash scripts/cd-preflight.sh | tee "$log"
          grep -F "Preflight passed. Local database is up to date." "$log"
          rm -f "$log"
          FLOW_CD_PREFLIGHT_LOCAL=1 SUPABASE_DB_URL="$db_url" bash scripts/cd-dry-run-pending.sh
      - name: Main Playwright suite against local Supabase
        run: |
          set -euo pipefail
          eval "$(bash scripts/ci-local-supabase-env.sh)"
          pnpm test:e2e

  deploy:
    needs: [lint, check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: cd-production
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require production secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FLOW_MCP_PEPPER: ${{ secrets.FLOW_MCP_PEPPER }}
        run: node scripts/cd-mcp-secrets.mjs

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.3

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the hosted dist
        run: pnpm build

      - name: Stamp the commit and check the hosted bundle
        run: |
          node scripts/stamp-build.mjs "$GITHUB_SHA"
          pnpm check:bundle

      - name: Probe the access token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions list --project-ref sxqpnetmtufkzowutduq >/dev/null

      - name: Read-only preflight and migration push
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/cd-push.sh

      - name: Deploy the hosted dist to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler pages deploy app/dist \
            --project-name=flow-app \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty

      - name: Set flow-mcp secrets, then deploy the function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FLOW_MCP_PEPPER: ${{ secrets.FLOW_MCP_PEPPER }}
        run: |
          set -euo pipefail
          umask 077
          envfile="$(mktemp "$RUNNER_TEMP/flow-mcp-secrets.XXXXXX")"
          echo "FLOW_MCP_ENV_FILE=$envfile" >> "$GITHUB_ENV"
          trap 'rm -f "$envfile"' EXIT INT TERM
          printf 'FLOW_MCP_PEPPER=%s\n' "$FLOW_MCP_PEPPER" > "$envfile"
          printf 'FLOW_MCP_APP_ORIGINS=%s\n' 'https://flow-app-dx5.pages.dev' >> "$envfile"
          supabase secrets set --project-ref sxqpnetmtufkzowutduq --env-file "$envfile"
          supabase functions deploy flow-mcp --project-ref sxqpnetmtufkzowutduq

      - name: Smoke the production hostname
        run: bash scripts/cd-smoke.sh "$GITHUB_SHA"

      - name: Remove the staged function secrets file
        if: always()
        run: |
          if [ -n "${FLOW_MCP_ENV_FILE:-}" ]; then
            rm -f "$FLOW_MCP_ENV_FILE"
          fi
