name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Migration filenames are append-only
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          if git cat-file -e origin/main:supabase/migrations.lock 2>/dev/null; then
            base="$(mktemp)"
            git show origin/main:supabase/migrations.lock > "$base"
            node scripts/check-migration-order.mjs --base "$base"
            rm -f "$base"
          else
            node scripts/check-migration-order.mjs
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Root bundle tests, then @flow/app and @flow/shared unit tests.
      - run: pnpm test
      - name: Build the hosted dist
        run: pnpm build
      - name: Stamp the commit and check the hosted bundle
        run: |
          node scripts/stamp-build.mjs "$GITHUB_SHA"
          pnpm check:bundle
          rm -rf hosted-dist
          mkdir -p hosted-dist
          cp -a app/dist/. hosted-dist/
      - name: Build the reviewers-only dist and check it
        env:
          VITE_REVIEWER_BUILD: "1"
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_ANON_KEY: ""
        run: |
          rm -rf app/dist
          pnpm build
          pnpm check:reviewer-bundle
          test ! -f app/dist/build.txt
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @flow/app exec playwright install --with-deps chromium
      - run: pnpm test:storybook
      - run: pnpm build-storybook
      - run: pnpm test:storybook:smoke
      - name: Upload hosted dist
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hosted-dist
          path: hosted-dist
          if-no-files-found: error
      - name: Upload reviewer dist
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-dist
          path: app/dist
          if-no-files-found: error
      - name: Upload storybook-static
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: app/storybook-static
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Start local Supabase
        run: supabase start
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @flow/app exec playwright install --with-deps chromium
      - name: pgTAP
        run: supabase test db supabase/tests/database
      - run: bash scripts/check-db-types.sh
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Deploy preflight against local Supabase
        run: |
          set -euo pipefail
          db_url="$(supabase status -o env | sed -n 's/^DB_URL=//p' | head -n 1 | tr -d '"')"
          log="$(mktemp)"
          FLOW_CD_PREFLIGHT_LOCAL=1 SUPABASE_DB_URL="$db_url" bash scripts/cd-preflight.sh | tee "$log"
          grep -F "Preflight passed. Remote database is up to date." "$log"
          rm -f "$log"
          FLOW_CD_PREFLIGHT_LOCAL=1 SUPABASE_DB_URL="$db_url" bash scripts/cd-dry-run-pending.sh
      - name: Main Playwright suite against local Supabase
        run: |
          set -euo pipefail
          eval "$(bash scripts/ci-local-supabase-env.sh)"
          pnpm test:e2e

  deploy:
    needs: [lint, check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: cd-production
      cancel-in-progress: false
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Require production secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${SUPABASE_DB_URL}" ] && missing+=(SUPABASE_DB_URL)
          [ -z "${CLOUDFLARE_API_TOKEN}" ] && missing+=(CLOUDFLARE_API_TOKEN)
          [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] && missing+=(CLOUDFLARE_ACCOUNT_ID)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Deploy failed. Missing production environment secrets: ${missing[*]}."
            echo "No migration was pushed and the hosted build was not deployed."
            exit 1
          fi

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.33.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.118.0

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the hosted dist
        run: pnpm build

      - name: Stamp the commit and check the hosted bundle
        run: |
          node scripts/stamp-build.mjs "$GITHUB_SHA"
          pnpm check:bundle

      - name: Read-only preflight and migration push
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/cd-push.sh

      - name: Deploy the hosted dist to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler pages deploy app/dist \
            --project-name=flow-app \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty

      - name: Smoke the production hostname
        run: bash scripts/cd-smoke.sh "$GITHUB_SHA"
