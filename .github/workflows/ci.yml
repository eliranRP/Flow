name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # `check` and `e2e` are the required status checks. Each is a gate over jobs that run side by side
  # on separate runners, so a PR waits for the slowest part instead of the sum of all parts.
  check-core:
    name: check (core)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Migration filenames are append-only
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          if git cat-file -e origin/main:supabase/migrations.lock 2>/dev/null; then
            base="$(mktemp)"
            git show origin/main:supabase/migrations.lock > "$base"
            node scripts/check-migration-order.mjs --base "$base"
            rm -f "$base"
          else
            node scripts/check-migration-order.mjs
          fi
      - name: Migrations do not commit early
        run: node scripts/check-migration-transaction.mjs
      - run: pnpm install --frozen-lockfile
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
      - name: Deno tests for flow-mcp
        run: deno test --allow-env --config supabase/functions/flow-mcp/deno.json supabase/functions/flow-mcp
      - run: pnpm typecheck
      # `pnpm test:unit`, including the @flow/app suite. '!flow' keeps the root package's own `test`
      # script (test:unit and test:connectors) from running again here.
      # scripts/ci-cd.test.mjs pins the test:unit script, so a new part there must be added here too.
      - name: Unit tests
        run: |
          set -euo pipefail
          node --test scripts/*.test.mjs
          pnpm -r --if-present --filter '!flow' test
          deno test --no-prompt --no-lock --node-modules-dir=none --ignore=supabase/functions/_shared/connectors supabase/functions/_shared
          deno test --no-prompt --node-modules-dir=none --config supabase/functions/_shared/connectors/deno.json supabase/functions/_shared/connectors
      # The Mercury fixture deny-list is an Actions secret. Fork PRs do not receive it.
      - name: Mercury connector tests
        env:
          MERCURY_FIXTURE_DENYLIST: ${{ secrets.MERCURY_FIXTURE_DENYLIST }}
          GITHUB_EVENT_HEAD_REPO_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: pnpm test:connectors
      - name: Build the hosted dist
        run: pnpm build
      - name: Stamp the commit and check the hosted bundle
        run: |
          node scripts/stamp-build.mjs "$GITHUB_SHA"
          pnpm check:bundle
          rm -rf hosted-dist
          mkdir -p hosted-dist
          cp -a app/dist/. hosted-dist/
      - name: Build the reviewers-only dist and check it
        env:
          VITE_REVIEWER_BUILD: "1"
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_ANON_KEY: ""
        run: |
          rm -rf app/dist
          pnpm build
          pnpm check:reviewer-bundle
          test ! -f app/dist/build.txt
      - name: Upload hosted dist
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-dist
          path: hosted-dist
          if-no-files-found: error
      - name: Upload reviewer dist
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewer-dist
          path: app/dist
          if-no-files-found: error

  # Storybook tests in the browser, the layout and clip specs, and the storybook-static artifact.
  check-storybook:
    name: check (storybook)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.63.0
      # The Ubuntu mirror can stall on the font packages, so their .deb files come from this cache.
      - name: Cache Playwright system packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/flow-apt
          key: ${{ runner.os }}-playwright-apt-1.63.0
      - name: Restore Playwright system packages
        run: bash scripts/ci-apt-cache.sh restore
      - name: Install Playwright system dependencies
        timeout-minutes: 8
        run: pnpm --filter @flow/app exec playwright install-deps chromium
      - name: Keep Playwright system packages for the next run
        run: bash scripts/ci-apt-cache.sh save
      - name: Install Playwright browsers
        timeout-minutes: 5
        run: pnpm --filter @flow/app exec playwright install chromium
      - run: pnpm test:storybook
      - run: pnpm build-storybook
      - name: Storybook smoke without the every-story test
        run: pnpm test:storybook:smoke --grep-invert "every static story"
      - name: Upload storybook-static
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-static
          path: app/storybook-static
          if-no-files-found: error

  # The every-story smoke opens each story once. Its 8 tests are split across two runners.
  check-stories:
    name: check (stories ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.63.0
      # The Ubuntu mirror can stall on the font packages, so their .deb files come from this cache.
      - name: Cache Playwright system packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/flow-apt
          key: ${{ runner.os }}-playwright-apt-1.63.0
      - name: Restore Playwright system packages
        run: bash scripts/ci-apt-cache.sh restore
      - name: Install Playwright system dependencies
        timeout-minutes: 8
        run: pnpm --filter @flow/app exec playwright install-deps chromium
      - name: Keep Playwright system packages for the next run
        run: bash scripts/ci-apt-cache.sh save
      - name: Install Playwright browsers
        timeout-minutes: 5
        run: pnpm --filter @flow/app exec playwright install chromium
      - run: pnpm build-storybook
      - name: Every static story (shard ${{ matrix.shard }}/2)
        run: pnpm test:storybook:smoke --grep "every static story" --shard=${{ matrix.shard }}/2

  # always(), not !cancelled(): a skipped required check counts as passing, so the gate must run and fail.
  check:
    needs: [check-core, check-storybook, check-stories]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check job passed
        env:
          CORE: ${{ needs.check-core.result }}
          STORYBOOK: ${{ needs.check-storybook.result }}
          STORIES: ${{ needs.check-stories.result }}
        run: |
          echo "check (core): $CORE"
          echo "check (storybook): $STORYBOOK"
          echo "check (stories): $STORIES"
          test "$CORE" = success
          test "$STORYBOOK" = success
          test "$STORIES" = success

  # The main Playwright suite is split across two runners. Each starts its own local Supabase.
  # Shard 1 also runs the database checks.
  e2e-shard:
    name: e2e (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0
      # Supabase pulls and starts its containers while node, pnpm, and Playwright install.
      # Studio, logs, mail, image, pooler, and realtime containers are not used by CI, so they stay off.
      - name: Start local Supabase in the background
        run: |
          # The exit file appears only once it holds the full status (written, then renamed).
          (supabase start -x studio,postgres-meta,logflare,vector,mailpit,imgproxy,supavisor,realtime > "$RUNNER_TEMP/supabase-start.log" 2>&1; echo "$?" > "$RUNNER_TEMP/supabase-start.exit.tmp"; mv "$RUNNER_TEMP/supabase-start.exit.tmp" "$RUNNER_TEMP/supabase-start.exit") > /dev/null 2>&1 &
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.63.0
      # The Ubuntu mirror can stall on the font packages, so their .deb files come from this cache.
      - name: Cache Playwright system packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/flow-apt
          key: ${{ runner.os }}-playwright-apt-1.63.0
      - name: Restore Playwright system packages
        run: bash scripts/ci-apt-cache.sh restore
      - name: Install Playwright system dependencies
        timeout-minutes: 8
        run: pnpm --filter @flow/app exec playwright install-deps chromium
      - name: Keep Playwright system packages for the next run
        run: bash scripts/ci-apt-cache.sh save
      - name: Install Playwright browsers
        timeout-minutes: 5
        run: pnpm --filter @flow/app exec playwright install chromium
      - name: Install psql
        if: matrix.shard == 1
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Wait for local Supabase
        timeout-minutes: 8
        run: |
          set -euo pipefail
          while [ ! -f "$RUNNER_TEMP/supabase-start.exit" ]; do sleep 2; done
          cat "$RUNNER_TEMP/supabase-start.log"
          test "$(cat "$RUNNER_TEMP/supabase-start.exit")" = 0
      - name: flow-mcp answers on the local API
        run: bash scripts/mcp-function-smoke.sh
      - name: pgTAP
        if: matrix.shard == 1
        run: supabase test db supabase/tests/database
      - if: matrix.shard == 1
        run: bash scripts/check-db-types.sh
      - name: Deploy preflight against local Supabase
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          db_url="$(supabase status -o env | sed -n 's/^DB_URL=//p' | head -n 1 | tr -d '"')"
          log="$(mktemp)"
          FLOW_CD_PREFLIGHT_LOCAL=1 SUPABASE_DB_URL="$db_url" bash scripts/cd-preflight.sh | tee "$log"
          grep -F "Preflight passed. Local database is up to date." "$log"
          rm -f "$log"
          FLOW_CD_PREFLIGHT_LOCAL=1 SUPABASE_DB_URL="$db_url" bash scripts/cd-dry-run-pending.sh
      - name: SUMIT cron jobs
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          db_url="$(supabase status -o env | sed -n 's/^DB_URL=//p' | head -n 1 | tr -d '"')"
          SUPABASE_DB_URL="$db_url" bash scripts/check-sumit-cron.sh
      - name: Main Playwright suite against local Supabase (shard ${{ matrix.shard }}/2)
        run: |
          set -euo pipefail
          eval "$(bash scripts/ci-local-supabase-env.sh)"
          pnpm test:e2e --shard=${{ matrix.shard }}/2

  # always(), not !cancelled(): see the check gate.
  e2e:
    needs: [e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every e2e shard passed
        env:
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          echo "e2e shards: $SHARDS"
          test "$SHARDS" = success

  deploy:
    needs: [lint, check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: cd-production
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require production secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FLOW_MCP_PEPPER: ${{ secrets.FLOW_MCP_PEPPER }}
        run: node scripts/cd-mcp-secrets.mjs

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.3

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the hosted dist
        run: pnpm build

      - name: Stamp the commit and check the hosted bundle
        run: |
          node scripts/stamp-build.mjs "$GITHUB_SHA"
          pnpm check:bundle

      - name: Probe the access token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions list --project-ref sxqpnetmtufkzowutduq >/dev/null

      - name: Deploy SUMIT functions and reseal before the migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          bash scripts/cd-preflight.sh
          supabase functions deploy sumit-sync --project-ref sxqpnetmtufkzowutduq
          supabase functions deploy sumit-connect --project-ref sxqpnetmtufkzowutduq
          supabase functions deploy sumit-reseal --project-ref sxqpnetmtufkzowutduq
          bash scripts/cd-sumit-reseal.sh
          supabase functions deploy mercury-connect --project-ref sxqpnetmtufkzowutduq
          supabase functions deploy mercury-sync --project-ref sxqpnetmtufkzowutduq

      - name: Read-only preflight and migration push
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/cd-push.sh

      - name: Deploy the hosted dist to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler pages deploy app/dist \
            --project-name=flow-app \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty

      - name: Set flow-mcp secrets, then deploy the function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FLOW_MCP_PEPPER: ${{ secrets.FLOW_MCP_PEPPER }}
        run: |
          set -euo pipefail
          umask 077
          envfile="$(mktemp "$RUNNER_TEMP/flow-mcp-secrets.XXXXXX")"
          echo "FLOW_MCP_ENV_FILE=$envfile" >> "$GITHUB_ENV"
          trap 'rm -f "$envfile"' EXIT INT TERM
          printf 'FLOW_MCP_PEPPER=%s\n' "$FLOW_MCP_PEPPER" > "$envfile"
          printf 'FLOW_MCP_APP_ORIGINS=%s\n' 'https://flow-app-dx5.pages.dev' >> "$envfile"
          supabase secrets set --project-ref sxqpnetmtufkzowutduq --env-file "$envfile"
          supabase functions deploy flow-mcp --project-ref sxqpnetmtufkzowutduq
          supabase functions deploy jev-tag --project-ref sxqpnetmtufkzowutduq

      - name: Smoke the production hostname
        run: bash scripts/cd-smoke.sh "$GITHUB_SHA"

      - name: Read-only smoke of the live app
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          SMOKE_COMPANY_NAME: Flow Test
        run: |
          set -euo pipefail
          if [ -z "${SMOKE_EMAIL:-}" ] || [ -z "${SMOKE_PASSWORD:-}" ]; then
            echo "SMOKE_EMAIL or SMOKE_PASSWORD is unset. Skipping the read-only smoke."
            printf '%s\n' \
              '### Warning: read-only smoke skipped' \
              '' \
              'SMOKE_EMAIL or SMOKE_PASSWORD is unset on the production environment. The live Playwright smoke did not run. This does not fail the deploy.' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pnpm --filter @flow/app exec playwright install-deps chromium
          pnpm --filter @flow/app exec playwright install chromium
          log="$(mktemp)"
          if ! pnpm --filter @flow/app test:e2e:smoke >"$log" 2>&1; then
            cat "$log"
            {
              echo '### Read-only smoke failed'
              echo
              echo 'Production is already live. Pages published this commit before this step, and this failure does not roll it back.'
              echo
              echo 'What failed: the read-only Playwright smoke. The step log has the Playwright output. This summary does not.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if grep -q '(retries)' "$log" || grep -q ' flaky' "$log"; then
            if ! grep -q 'passed on retry' "${GITHUB_STEP_SUMMARY:-/dev/null}"; then
              printf '%s\n' \
                '### Warning: read-only smoke passed on retry' \
                '' \
                'The first attempt failed and a retry passed. Production is already live. The Playwright output is in the step log, not in this summary.' \
                >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          cat "$log"

      - name: Remove the staged function secrets file
        if: always()
        run: |
          if [ -n "${FLOW_MCP_ENV_FILE:-}" ]; then
            rm -f "$FLOW_MCP_ENV_FILE"
          fi
