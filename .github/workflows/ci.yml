name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # A same-repo pull request also pushes the branch. Run that once.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Root bundle tests, then @flow/app and @flow/shared unit tests.
      - run: pnpm test
      - name: Build the hosted dist
        run: pnpm build
      - name: Stamp the commit and check the hosted bundle
        run: |
          node scripts/stamp-build.mjs "$GITHUB_SHA"
          pnpm check:bundle
          rm -rf hosted-dist
          mkdir -p hosted-dist
          cp -a app/dist/. hosted-dist/
      - name: Build the reviewers-only dist and check it
        env:
          VITE_REVIEWER_BUILD: "1"
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_ANON_KEY: ""
        run: |
          rm -rf app/dist
          pnpm build
          pnpm check:reviewer-bundle
          test ! -f app/dist/build.txt
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @flow/app exec playwright install --with-deps chromium
      - run: pnpm test:storybook
      - run: pnpm build-storybook
      - run: pnpm test:storybook:smoke
      - name: Upload hosted dist
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: hosted-dist
          path: hosted-dist
          if-no-files-found: error
      - name: Upload reviewer dist
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-dist
          path: app/dist
          if-no-files-found: error
      - name: Upload storybook-static
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: app/storybook-static
          if-no-files-found: error

  e2e:
    # A same-repo pull request also pushes the branch. Run that once.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Start local Supabase
        run: supabase start
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @flow/app exec playwright install --with-deps chromium
      - name: pgTAP
        run: supabase test db supabase/tests/database
      - run: bash scripts/check-db-types.sh
      - name: Main Playwright suite against local Supabase
        run: |
          set -euo pipefail
          eval "$(bash scripts/ci-local-supabase-env.sh)"
          pnpm test:e2e
