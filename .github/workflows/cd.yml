name: cd

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Skip when production secrets are missing
        id: gate
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${SUPABASE_DB_URL}" ] && missing+=(SUPABASE_DB_URL)
          [ -z "${CLOUDFLARE_API_TOKEN}" ] && missing+=(CLOUDFLARE_API_TOKEN)
          [ -z "${CLOUDFLARE_ACCOUNT_ID}" ] && missing+=(CLOUDFLARE_ACCOUNT_ID)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "CD skipped. Missing production secrets: ${missing[*]}."
            echo "No migration was pushed and the hosted build was not deployed."
            echo "Add the missing repository Actions secrets, and push to main again."
            echo "::notice title=CD skipped::Missing production secrets: ${missing[*]}. No migration was pushed and the hosted build was not deployed."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "Production secrets are present. Continuing with the read-only preflight."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.deploy == 'true'
        with:
          version: 10.33.3

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.deploy == 'true'
        with:
          node-version: 22
          cache: pnpm

      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.deploy == 'true'
        with:
          version: 2.118.0

      - name: Install psql
        if: steps.gate.outputs.deploy == 'true'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        if: steps.gate.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile

      - name: Read-only preflight and migration push
        if: steps.gate.outputs.deploy == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/cd-push.sh

      - name: Build the hosted dist
        if: steps.gate.outputs.deploy == 'true'
        run: |
          if [ -n "${VITE_REVIEWER_BUILD:-}" ]; then
            echo "Refusing to deploy a reviewers-only build."
            exit 1
          fi
          pnpm build

      - name: Stamp the commit and check the hosted bundle
        if: steps.gate.outputs.deploy == 'true'
        run: |
          node scripts/stamp-build.mjs "$GITHUB_SHA"
          pnpm check:bundle

      - name: Deploy the hosted dist to Cloudflare Pages
        if: steps.gate.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.144.0 pages deploy app/dist \
            --project-name=flow-app \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty

      - name: Smoke the production hostname
        if: steps.gate.outputs.deploy == 'true'
        run: bash scripts/cd-smoke.sh "$GITHUB_SHA"
