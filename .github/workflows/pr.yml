name: pr

# The check a pull request waits for (FLOW-832). The pre-push hook runs scripts/local-ci.sh --part quick
# before each push; this workflow runs the rest of the gate on GitHub, as parallel jobs, one per slice of
# scripts/local-ci.sh. `pr` is the required check: it passes when every job it needs passed, or was skipped
# because the diff does not touch its area. main runs the full suite on every merge (ci.yml).
# No secrets here: the production deny-list secret stays on main.
# FLOW-835: the typecheck is its own job (types), beside static; the app tests run in six shards; and the
# runner jobs restore the pnpm store from main's cache and never save one (ci.yml saves it), so a job's
# post-step does not wait on an upload. The test shards run in a container and install without it.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Whether the diff touches supabase/ (a migration, a seed, a pgTAP file or an edge function), and whether it is
  # docs-only (docs/, design/, or any .md file).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      db: ${{ steps.paths.outputs.db }}
      ui: ${{ steps.paths.outputs.ui }}
      docs: ${{ steps.paths.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git fetch --no-tags origin main
      - id: paths
        run: |
          set -euo pipefail
          files="$(git diff --name-only origin/main...HEAD)"
          if grep -q '^supabase/' <<<"$files"; then
            echo "db=true" >> "$GITHUB_OUTPUT"
          else
            echo "db=false" >> "$GITHUB_OUTPUT"
          fi
          # FLOW-836: the app's source, its e2e specs, and the build, test and package config that the
          # dev server and Playwright read. Script-only and doc-only changes skip the e2e job.
          if grep -Eq '^(app/(src|e2e)/|app/(vite|playwright[^/]*|vitest)\.config\.[mc]?[jt]s$|app/package\.json$|package\.json$|pnpm-lock\.yaml$)' <<<"$files"; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi
          # A docs-only diff skips the typecheck and the unit tests. static still runs: backlog-index --check reads
          # docs/backlog. An empty diff is not docs-only.
          if [ -n "$files" ] && ! grep -qvE '^(docs/|design/)|\.md$' <<<"$files"; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi

  static:
    name: pr (static)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # Read only: a PR job restores main's store and never saves one, so no post-step upload is waited on.
      - name: Restore the pnpm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: node-cache-Linux-x64-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: node-cache-Linux-x64-pnpm-
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
      - run: git fetch --no-tags origin main
      - name: Migration, file-size and backlog checks, flow-mcp tests, edge functions, lint with importers
        run: bash scripts/local-ci.sh --part static

  # The typecheck, the unused-code and CSS checks (FLOW-835: a job of its own, so it runs beside static).
  types:
    name: pr (types)
    needs: [changes]
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # Read only: a PR job restores main's store and never saves one, so no post-step upload is waited on.
      - name: Restore the pnpm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: node-cache-Linux-x64-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: node-cache-Linux-x64-pnpm-
      - run: git fetch --no-tags origin main
      - name: Typecheck, unused code and CSS
        run: bash scripts/local-ci.sh --part types

  # Six shards of the app's unit and Storybook vitest tests that the change reaches. The Playwright
  # image carries the browsers, so the job installs none.
  tests:
    name: pr (tests ${{ matrix.shard }}/6)
    needs: [changes]
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # No store restore here: in this container it missed although the path and key matched main's (likely a
      # cache-version difference from the archive format; unverified). A cold install costs a few seconds.
      # The container runs as root, but the checkout belongs to the runner's user: git refuses the repo
      # until the workspace is marked safe.
      - name: Mark the workspace safe and fetch main
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags origin main
      - name: Related app unit and Storybook tests (shard ${{ matrix.shard }}/6)
        run: bash scripts/local-ci.sh --part tests --shard ${{ matrix.shard }}/6

  # FLOW-836: main's Playwright suite on the PR, only for a UI change (see changes). Six shards, the same
  # split and spec set as main's e2e-shard job: four shards of the main suite and two sweeps. Each shard
  # starts its own local Supabase and its own dev server; the database part, pgTAP and the deploy checks stay
  # on main. The runner jobs restore Playwright's browsers and apt packages from main's caches and never save.
  # A draft's pushes skip the e2e shards (the stopgap until CI v2): they run once the PR is ready for review, and on each push after that.
  e2e:
    name: pr (e2e ${{ matrix.part }})
    needs: [changes]
    if: needs.changes.outputs.ui == 'true' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: 1/4, shard: 1/4, filter: --grep-invert }
          - { part: 2/4, shard: 2/4, filter: --grep-invert }
          - { part: 3/4, shard: 3/4, filter: --grep-invert }
          - { part: 4/4, shard: 4/4, filter: --grep-invert }
          - { part: sweeps 1/2, shard: 1/2, filter: --grep }
          - { part: sweeps 2/2, shard: 2/2, filter: --grep }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0
      # Supabase pulls and starts its containers while node, pnpm, and Playwright install.
      - name: Start local Supabase in the background
        run: |
          (bash scripts/ci-supabase-start.sh -x studio,postgres-meta,logflare,vector,mailpit,imgproxy,supavisor,realtime > /dev/null 2>&1; echo "$?" > "$RUNNER_TEMP/supabase-start.exit.tmp"; mv "$RUNNER_TEMP/supabase-start.exit.tmp" "$RUNNER_TEMP/supabase-start.exit") > /dev/null 2>&1 &
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore the pnpm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: node-cache-Linux-x64-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: node-cache-Linux-x64-pnpm-
      - run: pnpm install --frozen-lockfile
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.63.0
      - name: Restore Playwright system packages
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/flow-apt
          key: ${{ runner.os }}-playwright-apt-1.63.0-none
          restore-keys: ${{ runner.os }}-playwright-apt-1.63.0
      - name: Restore apt packages from the cache
        run: bash scripts/ci-apt-cache.sh restore
      - name: Install Playwright system dependencies
        timeout-minutes: 8
        run: bash scripts/ci-apt-cache.sh install
      # An exact hit means the browsers are already in the cache. The apt restore is prefix-only, so its cache-hit
      # is never exact: ci-apt-cache.sh install already returns at once when no package is missing.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: pnpm --filter @flow/app exec playwright install chromium
      - name: Wait for local Supabase
        timeout-minutes: 8
        run: |
          set -euo pipefail
          while [ ! -f "$RUNNER_TEMP/supabase-start.exit" ]; do sleep 2; done
          cat "$RUNNER_TEMP/supabase-start.log"
          test "$(cat "$RUNNER_TEMP/supabase-start.exit")" = 0
      # The smoke reads the same local API in every shard, so the first Playwright shard runs it alone.
      - name: flow-mcp answers on the local API
        if: matrix.part == '1/4'
        run: bash scripts/mcp-function-smoke.sh
      - name: Main Playwright suite against local Supabase (${{ matrix.part }})
        run: |
          set -euo pipefail
          eval "$(bash scripts/ci-local-supabase-env.sh)"
          pnpm test:e2e --shard=${{ matrix.shard }} ${{ matrix.filter }} "no enabled control is a no-op"

  # Local Supabase with every service but the database, the REST API, auth and the edge runtime.
  db:
    name: pr (db)
    needs: [changes]
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # Read only: a PR job restores main's store and never saves one, so no post-step upload is waited on.
      - name: Restore the pnpm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: node-cache-Linux-x64-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: node-cache-Linux-x64-pnpm-
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0
      - run: git fetch --no-tags origin main
      - name: Start local Supabase (database, REST, auth and edge runtime only)
        timeout-minutes: 8
        run: bash scripts/ci-supabase-start.sh -x studio,postgres-meta,logflare,vector,mailpit,imgproxy,supavisor,realtime,storage-api
      - name: Migrations, flow-mcp smoke, pgTAP and db types
        run: bash scripts/local-ci.sh --part db

  # The check a merge waits for. Every job it needs must have passed, or been skipped on purpose (db when
  # the diff does not touch supabase/). always(), not !cancelled(): a skipped job must not hide a failed one.
  pr:
    needs: [changes, static, types, tests, e2e, db]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job the diff needs passed
        env:
          CHANGES: ${{ needs.changes.result }}
          STATIC: ${{ needs.static.result }}
          TYPES: ${{ needs.types.result }}
          TESTS: ${{ needs.tests.result }}
          E2E: ${{ needs.e2e.result }}
          UI_CHANGED: ${{ needs.changes.outputs.ui }}
          DOCS: ${{ needs.changes.outputs.docs }}
          DRAFT: ${{ github.event.pull_request.draft }}
          DB: ${{ needs.db.result }}
          DB_CHANGED: ${{ needs.changes.outputs.db }}
        run: |
          echo "changes: $CHANGES"
          echo "static: $STATIC"
          echo "types: $TYPES"
          echo "tests: $TESTS"
          echo "e2e: $E2E (the diff touches the app: $UI_CHANGED, draft: $DRAFT)"
          echo "db: $DB (the diff touches supabase/: $DB_CHANGED)"
          test "$CHANGES" = success
          test "$STATIC" = success
          # A docs-only diff skips types and tests on purpose. Any other diff must have run them.
          if [ "$DOCS" = true ]; then
            test "$TYPES" = skipped
            test "$TESTS" = skipped
          else
            test "$TYPES" = success
            test "$TESTS" = success
          fi
          if [ "$UI_CHANGED" = true ] && [ "$DRAFT" != true ]; then
            test "$E2E" = success
          else
            test "$E2E" = skipped
          fi
          if [ "$DB_CHANGED" = true ]; then
            test "$DB" = success
          else
            test "$DB" = skipped
          fi
