<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual" />
    <script>
      // FLOW-372: the saved light or dark choice, before first paint. theme-store.ts reads the same key.
      (function () {
        try {
          const theme = localStorage.getItem("flow.theme");
          if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
        } catch {}
        // FLOW-1274: the first Intl.DateTimeFormat with a time zone loads the zone data (about 40 ms on the
        // phone profile), and Home's first read needs today's date. Doing it in the idle wait for the entry
        // download takes it off the path to that read. defaultPeriod (period.ts) uses the same zone.
        setTimeout(function () {
          try { new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Jerusalem" }).format(0); } catch {}
        }, 0);
      })();
    </script>
    <style>
      /* FLOW-1277: the page colour before any CSS or script has loaded, so a dark phone never flashes white.
         The same values as --color-bg in design/system/implementation-tokens.css; the saved choice (the script above) wins. */
      html { background: #F6F4FA; }
      html[data-theme="dark"] { background: #15111E; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { background: #15111E; } }
    </style>
    <meta name="theme-color" content="#7B3FE4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Flow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
